<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🩸DripAnime🩸</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:#fff;
display:flex;
overflow-x:hidden;
}

/* SIDEBAR */
.sidebar{
width:180px;
background:#111;
height:100vh;
position:fixed;
left:0;
top:0;
padding:12px;
border-right:1px solid #222;
}

.sidebar h3{
color:#ff3b3b;
margin:5px 0 15px;
font-size:14px;
}

.nav{
padding:8px;
font-size:13px;
color:#aaa;
cursor:pointer;
}

.nav:hover{color:#fff}

/* MAIN */
.main{
margin-left:180px;
width:100%;
padding:10px;
position:relative;
}

/* SEARCH */
.search{
width:100%;
padding:10px;
background:#1b1b1b;
border:none;
color:#fff;
border-radius:6px;
outline:none;
margin-bottom:10px;
}

/* SUGGEST */
#suggest{
position:absolute;
top:48px;
left:10px;
right:10px;
background:#111;
border-radius:6px;
z-index:999;
max-height:200px;
overflow:auto;
}

.sug{
padding:10px;
font-size:12px;
border-bottom:1px solid #222;
cursor:pointer;
}

.sug:hover{background:#222}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:10px;
}

/* CARD */
.card{
background:#151515;
border-radius:6px;
overflow:hidden;
cursor:pointer;
height:230px;
position:relative;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card p{
font-size:11px;
margin:5px;
color:#ddd;
}

/* HOVER VIDEO */
.video-hover{
position:absolute;
top:0;
left:0;
width:100%;
height:180px;
border:none;
pointer-events:none;
z-index:5;
}

/* DRAWER */
#drawer{
position:fixed;
right:-420px;
top:0;
width:420px;
max-width:100%;
height:100vh;
background:#141414;
transition:.25s ease;
z-index:999;
overflow:auto;
}

#drawer.open{right:0}

.drawer-img{
width:100%;
height:220px;
object-fit:cover;
}

.drawer-content{padding:10px}

.drawer-title{font-size:16px;margin:5px 0}

.meta{font-size:12px;color:#aaa;margin-bottom:8px}

.desc{font-size:12px;color:#ccc;line-height:1.4}

.close{
position:absolute;
top:10px;
right:12px;
cursor:pointer;
color:#aaa;
}

iframe{
width:100%;
height:180px;
margin-top:10px;
border-radius:8px;
border:none;
}

/* EPISODES */
#episodes{
margin-top:10px;
}

.ep{
padding:8px;
border-bottom:1px solid #222;
cursor:pointer;
font-size:12px;
}

.ep:hover{background:#222}

/* MOBILE FIX */
@media (max-width: 768px){

body{flex-direction:column;}

.sidebar{
position:relative;
width:100%;
height:auto;
display:flex;
overflow-x:auto;
gap:10px;
}

.main{
margin-left:0;
width:100%;
}

.grid{
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
}

#drawer{
width:100%;
right:-100%;
}

#drawer.open{right:0;}
}
</style>
</head>

<body>

<div class="sidebar">
<h3>🩸DripAnime🩸</h3>
<div class="nav" onclick="setMode('trending')">🔥 Trending</div>
<div class="nav" onclick="setMode('latest')">🆕 Latest</div>
<div class="nav" onclick="setMode('action')">⚔ Action</div>
<div class="nav" onclick="setMode('romance')">💖 Romance</div>
<div class="nav" onclick="setMode('comedy')">😂 Comedy</div>
</div>

<div class="main">

<input id="search" class="search" placeholder="Search anime..." />
<div id="suggest"></div>

<div id="grid" class="grid"></div>

</div>

<div id="drawer">
<div class="close" onclick="closeDrawer()">✖</div>

<img id="dimg" class="drawer-img">

<div class="drawer-content">
<div id="dtitle" class="drawer-title"></div>
<div id="dmeta" class="meta"></div>
<div id="ddesc" class="desc"></div>
<div id="dtrail"></div>
<div id="episodes"></div>
</div>
</div>

<script>

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const suggest=document.getElementById("suggest");
const drawer=document.getElementById("drawer");
const dimg=document.getElementById("dimg");
const dtitle=document.getElementById("dtitle");
const dmeta=document.getElementById("dmeta");
const ddesc=document.getElementById("ddesc");
const dtrail=document.getElementById("dtrail");
const episodes=document.getElementById("episodes");

let mode="trending";
let loading=false;
let searching=false;

let activeHover=null;

let memory={
progress: JSON.parse(localStorage.getItem("progress")||"{}")
};

/* FETCH */
async function fetchAnime(reset=false){

if(loading) return;
loading=true;

if(reset) grid.innerHTML="";

let sort="POPULARITY_DESC";
let genre=null;

if(mode==="latest") sort="UPDATED_AT_DESC";
if(["action","romance","comedy"].includes(mode)) genre=mode;

const res=await fetch("https://graphql.anilist.co",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
query:`
query($genre:String,$sort:[MediaSort]){
Page(perPage:20){
media(type:ANIME,genre:$genre,sort:$sort){
id
title{romaji}
coverImage{large}
description
episodes
averageScore
trailer{ id }
}
}
}
`,
variables:{genre,sort}
})
});

const data=await res.json();
render(data.data.Page.media,reset);

loading=false;
}

/* SEARCH */
async function searchAnime(q){

if(q.length<2){
searching=false;
fetchAnime(true);
return;
}

searching=true;

const res=await fetch("https://graphql.anilist.co",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
query:`
query($search:String){
Page(perPage:20){
media(search:$search,type:ANIME){
id
title{romaji}
coverImage{large}
description
episodes
averageScore
trailer{ id }
}
}
}
`,
variables:{search:q}
})
});

const data=await res.json();
render(data.data.Page.media,true);
}

/* INPUT */
search.addEventListener("input",(e)=>{
let q=e.target.value.trim();

if(q.length<2){
searching=false;
suggest.innerHTML="";
fetchAnime(true);
return;
}

searchAnime(q);
});

/* RENDER */
function render(list,reset){

if(reset) grid.innerHTML="";

list.forEach(a=>{

let c=document.createElement("div");
c.className="card";

c.innerHTML=`
<img src="${a.coverImage.large}">
<p>${a.title.romaji}</p>
`;

let iframe;

/* HOVER */
c.onmouseenter=()=>{

if(activeHover) activeHover.remove();

let title=encodeURIComponent(a.title.romaji+" trailer");

let src=a.trailer?.id
?`https://www.youtube.com/embed/${a.trailer.id}?autoplay=1&mute=1&controls=0`
:`https://www.youtube.com/embed?listType=search&list=${title}&autoplay=1&mute=1&controls=0`;

iframe=document.createElement("iframe");
iframe.className="video-hover";
iframe.src=src;

c.appendChild(iframe);
activeHover=iframe;
};

c.onmouseleave=()=>{
if(activeHover){
activeHover.remove();
activeHover=null;
}
};

c.onclick=()=>openDrawer(a);

grid.appendChild(c);

});

}

/* DRAWER */
function openDrawer(a){

drawer.classList.add("open");

dimg.src=a.coverImage.large;
dtitle.innerText=a.title.romaji;
dmeta.innerText=`⭐ ${a.averageScore||"?"} • 🎬 ${a.episodes||"?"}`;

ddesc.innerText=(a.description||"").replace(/<[^>]*>/g,"");

episodes.innerHTML="";

let title=encodeURIComponent(a.title.romaji+" trailer");

dtrail.innerHTML=a.trailer?.id
?`<iframe src="https://www.youtube.com/embed/${a.trailer.id}?autoplay=1&mute=1"></iframe>`
:`<iframe src="https://www.youtube.com/embed?listType=search&list=${title}&autoplay=1&mute=1"></iframe>`;

/* EPISODES */
let eps=a.episodes||12;

for(let i=1;i<=eps;i++){

let ep=document.createElement("div");
ep.className="ep";
ep.innerText="Episode "+i;

ep.onclick=()=>{

memory.progress[a.title.romaji]=i;
localStorage.setItem("progress",JSON.stringify(memory.progress));

if(a.title.romaji.toLowerCase().includes("toradora") && i===1){
dtrail.innerHTML=`
<iframe src="https://vibeplayer.site/ef550a4ea511d374" allowfullscreen></iframe>
`;
}

};

episodes.appendChild(ep);
}

}

function closeDrawer(){
drawer.classList.remove("open");
}

function setMode(m){
mode=m;
search.value="";
suggest.innerHTML="";
fetchAnime(true);
}

fetchAnime(true);

</script>

</body>
</html>
